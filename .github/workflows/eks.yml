on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
name: EKS - Build, Scan and Deploy

# Prevents overlapping runs from clobbering each other's EKS CIDR updates
concurrency:
  group: eks-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: EKS - Build, Scan and Deploy
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set image URI
      run: echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ secrets.REPO_NAME }}:${{ github.sha }}" >> $GITHUB_ENV

    # Build the Docker image (not pushed yet - the scan gates the push)
    - name: Build the image
      id: build-image
      run: docker build -t "$IMAGE_URI" .

    # Cortex Cloud Image Security Scan (official action)
    - name: Cortex Cloud Image Scan
      id: scan
      uses: PaloAltoNetworks/cortex-cloud-scan@v1
      with:
        scan-type: image
        api-base-url: ${{ vars.CORTEX_API_URL }}
        api-key: ${{ secrets.CORTEX_API_KEY }}
        api-key-id: ${{ secrets.CORTEX_API_ID }}
        image: ${{ env.IMAGE_URI }}
        ci-pipeline-id: ${{ github.run_id }}
        ci-build-id: ${{ github.run_number }}
        image-timeout: 300
        soft-fail: false
        log-level: INFO
        support: true   # temporary: generates a diagnostic bundle; remove once the gate works

    - name: Upload Cortex support bundle
      if: always() && steps.scan.outputs.support-bundle != ''
      uses: actions/upload-artifact@v4
      with:
        name: cortex-support-bundle
        path: ${{ steps.scan.outputs.support-bundle }}
        retention-days: 7

    # Push only runs if the scan passed
    - name: Push the image to Amazon ECR
      id: push-image
      run: |
        echo "Pushing image to ECR..."
        docker push "$IMAGE_URI"

    - name: Set up kubeconfig
      run: |-
        if [ -z "${{ vars.AWS_EKS_NAME }}" ]
        then
          mkdir -p ~/.kube
          echo ${{ secrets.KUBE_CONFIG_DATA }} | base64 -d > ~/.kube/config
        else
          aws eks update-kubeconfig --name ${{ vars.AWS_EKS_NAME }} --region ${{ secrets.AWS_REGION }}
        fi

    - name: Set up aws-iam-authenticator
      run: |-
        curl -Lo aws-iam-authenticator https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v0.5.9/aws-iam-authenticator_0.5.9_linux_amd64
        chmod +x ./aws-iam-authenticator
        sudo mv aws-iam-authenticator /usr/local/bin

    - name: Allow runner IP on EKS endpoint
      run: |
        RUNNER_IP=$(curl -s https://checkip.amazonaws.com)/32
        CURRENT=$(aws eks describe-cluster --name ${{ vars.AWS_EKS_NAME }} --region ${{ secrets.AWS_REGION }} \
          --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text | tr '\t' ',')
        aws eks update-cluster-config --name ${{ vars.AWS_EKS_NAME }} --region ${{ secrets.AWS_REGION }} \
          --resources-vpc-config publicAccessCidrs="${CURRENT},${RUNNER_IP}"
        echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
        aws eks wait cluster-active --name ${{ vars.AWS_EKS_NAME }} --region ${{ secrets.AWS_REGION }}

    - name: Deploy to Kubernetes cluster
      run: |-
        kustomize create --resources eks-deployment.yml
        kustomize edit set image "demo-image-name=$IMAGE_URI"
        cat kustomization.yaml
        kustomize build . | kubectl apply -f - --validate=false
        kubectl get pods -o wide

    - name: Remove runner IP
      if: always()
      run: |
        if [ -z "$RUNNER_IP" ]; then echo "No runner IP added, skipping"; exit 0; fi
        aws eks wait cluster-active --name ${{ vars.AWS_EKS_NAME }} --region ${{ secrets.AWS_REGION }}
        REMAINING=$(aws eks describe-cluster --name ${{ vars.AWS_EKS_NAME }} --region ${{ secrets.AWS_REGION }} \
          --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text \
          | tr '\t' '\n' | grep -vx "$RUNNER_IP" | paste -sd, -)
        aws eks update-cluster-config --name ${{ vars.AWS_EKS_NAME }} --region ${{ secrets.AWS_REGION }} \
          --resources-vpc-config publicAccessCidrs="${REMAINING}"
